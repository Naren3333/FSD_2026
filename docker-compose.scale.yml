# run three submission-path replicas with independent cpu limits.
x-replicated: &replicated
  deploy:
    replicas: 3
    resources:
      limits:
        cpus: ${REPLICA_CPUS:-0.25}

services:
  postgres:
    # each replica opens a pool of up to 10 connections (packages/platform/db.go), so three replicas of
    # three services need more than postgresql's default of 100.
    command: [postgres, -c, max_connections=300]
  identity: *replicated
  assessment: *replicated
  grading: *replicated
  # the load generator (scripts/load/deadline.js).
  k6:
    image: grafana/k6:1.0.0
    profiles: [load]
    environment:
      BASE_URL: http://kong:8000/api
    volumes:
    - ./scripts/load:/scripts:ro
    - ./.local/scale-demo:/work:ro
