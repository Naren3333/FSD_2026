<header class="page-header">
  <div class="page-header-title">
    <h2 [attr.id]="headingId || null" [attr.tabindex]="headingId ? -1 : null">{{ title }}</h2>
    @if (subtitle) {
      <p class="page-header-subtitle">{{ subtitle }}</p>
    }
  </div>
  <div class="page-header-actions">
    <ng-content />
  </div>
</header>
