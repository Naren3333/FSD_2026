# Serves the built app. Section URLs such as /materials are client-side routes: any path that is not a file gets
# index.html, so a refresh or a shared link opens the right section.
server {
  listen 80;
  root /usr/share/nginx/html;

  # The app only talks to Kong and Keycloak, at the stack's GATEWAY_URL and KEYCLOAK_URL. The image installs this
  # file as a template, so nginx fills both in from the container's environment when it starts (docker-compose.yml
  # sets them for the ports each stack publishes) and hands them to the app as /config.json. Scripts come only from
  # this origin (angular.json turns off critical-CSS inlining, whose onload attribute is an inline script). Styles allow inline because Angular writes component styles into <style> tags.
  # Figures and opened PDFs are blob: URLs the app creates. Keycloak sign-in is a full-page redirect, not a frame.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self' ${GATEWAY_URL} ${KEYCLOAK_URL}; frame-src 'self' blob: ${KEYCLOAK_URL}; object-src 'self' blob:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location = /config.json {
    default_type application/json;
    return 200 '{"gatewayUrl":"${GATEWAY_URL}","keycloakUrl":"${KEYCLOAK_URL}"}';
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
