# serves the built app.
server {
  listen 8080;
  root /usr/share/nginx/html;
# the app only talks to kong and keycloak, at the stack's gateway_url and keycloak_url.
# file as a template, so nginx fills both in from the container's environment when it starts
# (docker-compose.yml
# sets them for the ports each stack publishes) and hands them to the app as /config.json.
# this origin (angular.json turns off critical-css inlining, whose onload attribute is an inline script).
# figures and opened pdfs are blob: urls the app creates.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self' ${GATEWAY_URL} ${KEYCLOAK_URL}; frame-src 'self' blob: ${KEYCLOAK_URL}; object-src 'self' blob:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location = /config.json {
    default_type application/json;
    return 200 '{"gatewayUrl":"${GATEWAY_URL}","keycloakUrl":"${KEYCLOAK_URL}"}';
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
