# ==== Teacher and refusal batch (2026-10-13) ====
# Added after a review found only 5 teacher queries and a 20-query floor sample. All holdout, labelled from the
# PDF text before any run. t1 sees C1 and C2, the rubric and the marking scheme, so each `expect` lists every
