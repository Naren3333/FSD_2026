# Golden retrieval queries, ported from fsd_test's knowledge/eval/golden.yaml (its RAG_PLAN.md has the history).
# Run with scripts/eval/run_golden.py after scripts/eval/load_corpus.py. Corpus: corpus.yaml (CSD lecture decks + gen-* stand-ins).
# Users: t1 = teacher (C1 and C2), s1 = student (C1 only), s2 = eval-student2 (C2 only).
# C1: decks 01-06, 10, 11, the rubric, the marking scheme, the Git handout. C2: 09 Basic Security, 12 Automation.
# `page` is the slide the answer is on; several entries mean any of them counts.
# Since Iteration 12 the `tables` / `figures` queries are `kind`-checked: only a table / figure chunk counts.

# Unless tagged `group: prose`, queries are about the slide decks (group "default" = slides).
