name: learning-foundation
# each application's healthcheck asks its own /health/ready from inside its container.
x-go-healthcheck: &go-healthcheck
  test:
  - CMD
  - /app
  - -healthcheck
  interval: 30s
  timeout: 5s
  start_period: 180s
  start_interval: 3s
  retries: 3
x-python-healthcheck: &python-healthcheck
  test:
  - CMD
  - python
  - -c
  - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=3)
  interval: 30s
  timeout: 5s
  start_period: 180s
  start_interval: 3s
  retries: 3
services:
  postgres:
    # postgres 17 with pgvector, for content's chunk embeddings
    image: pgvector/pgvector:0.8.1-pg17
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup.py or scripts/upgrade_local.py}
    volumes:
    - postgres-data:/var/lib/postgresql/data
    # the test stack (scripts/stack_tests.py) reads its own first-start files from local_config_dir.
    - ${LOCAL_CONFIG_DIR:-./.local}/postgres-init.sql:/docker-entrypoint-initdb.d/01-services.sql:ro
    healthcheck:
      test:
      - CMD-SHELL
      # over tcp: the temporary server that runs the init scripts only listens on the socket
      - pg_isready -h 127.0.0.1 -U postgres
      interval: 5s
      timeout: 3s
      retries: 20
  keycloak:
    image: quay.io/keycloak/keycloak:26.3.3
    restart: unless-stopped
    command:
    - start-dev
    - --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Run scripts/setup.py or scripts/upgrade_local.py}
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8081}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: 'true'
      KC_HEALTH_ENABLED: 'true'
    ports:
    - 127.0.0.1:${KEYCLOAK_PORT:-8081}:8080
    volumes:
    - ${LOCAL_CONFIG_DIR:-./.local}/learning-realm.json:/opt/keycloak/data/import/learning-realm.json:ro
    - keycloak-data:/opt/keycloak/data
    healthcheck:
      # the image has no curl or wget: ask the management port's readiness check with bash's /dev/tcp and
      # read the status code from the response's first line.
      test:
      - CMD
      - bash
      - -c
      - >-
        exec 3<>/dev/tcp/127.0.0.1/9000 &&
        printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
        read -r _ code _ <&3 && [ "$$code" = 200 ]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 60
  kafka:
    image: apache/kafka:4.1.2
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_RETENTION_HOURS: 720
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
    - kafka-data:/var/lib/kafka/data
    healthcheck:
      # each check starts a jvm, so once kafka is up it is checked only every minute.
      test:
      - CMD-SHELL
      - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list
      interval: 60s
      timeout: 20s
      start_period: 120s
      start_interval: 5s
      retries: 3
  kafka-init:
    image: apache/kafka:4.1.2
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint:
    - /bin/sh
    - -ec
    command:
    - for topic in content.uploaded.v1 content.indexed.v1 content.deleted.v1 assessment.submitted.v4
      grading.finalized.v3 identity.classroom.deleted.v1 assessment.deleted.v1
      identity.enrollment.removed.v1 assessment.due_changed.v1 identity.user.deleted.v1
      assessment.submitted.v4.dlq grading.finalized.v3.dlq
      identity.classroom.deleted.v1.dlq assessment.deleted.v1.dlq content.deleted.v1.dlq
      identity.enrollment.removed.v1.dlq assessment.due_changed.v1.dlq identity.user.deleted.v1.dlq; do /opt/kafka/bin/kafka-topics.sh
      --bootstrap-server kafka:9092 --create --if-not-exists --topic $$topic --partitions
      3 --replication-factor 1; done;
      for topic in assessment.submitted.v4 grading.finalized.v3
      assessment.submitted.v4.dlq grading.finalized.v3.dlq
      identity.classroom.deleted.v1.dlq assessment.deleted.v1.dlq content.deleted.v1.dlq
      identity.enrollment.removed.v1.dlq assessment.due_changed.v1.dlq identity.user.deleted.v1.dlq;
      do /opt/kafka/bin/kafka-configs.sh --bootstrap-server kafka:9092 --alter --entity-type topics
      --entity-name $$topic --add-config retention.ms=604800000; done
  # s3-compatible document storage.
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    environment:
      ROOT_USER: ${S3_ROOT_USER:?Run scripts/setup.py or scripts/upgrade_local.py}
      ROOT_PASSWORD: ${S3_ROOT_PASSWORD:?Run scripts/setup.py or scripts/upgrade_local.py}
      CONTENT_USER: ${S3_CONTENT_USER:?Run scripts/setup.py or scripts/upgrade_local.py}
      CONTENT_PASSWORD: ${S3_CONTENT_PASSWORD:?Run scripts/setup.py or scripts/upgrade_local.py}
    entrypoint:
    - /bin/sh
    - -ec
    command:
    - umask 077; printf '{"identities":[{"name":"admin","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","List","Tagging","Write"]},{"name":"content-service","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Read:documents","Write:documents","List:documents"]}]}'
      "$$ROOT_USER" "$$ROOT_PASSWORD" "$$CONTENT_USER" "$$CONTENT_PASSWORD" > /tmp/s3.json;
      exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    volumes:
    - seaweedfs-data:/data
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q -O /dev/null http://127.0.0.1:9333/cluster/status
      interval: 3s
      timeout: 3s
      retries: 40
  storage-init:
    image: chrislusf/seaweedfs:4.48
    depends_on:
      seaweedfs:
        condition: service_healthy
    entrypoint:
    - /bin/sh
    - -ec
    command:
    - for i in $$(seq 1 60); do echo s3.bucket.list | weed shell -master=seaweedfs:9333 > /tmp/buckets && break; sleep 2; done;
      grep -q '^ *documents' /tmp/buckets || echo 's3.bucket.create -name documents' | weed shell -master=seaweedfs:9333;
      echo s3.bucket.list | weed shell -master=seaweedfs:9333 | grep -q '^ *documents'
  gateway-config:
    image: python:3.13.7-alpine
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      # the issuer kong accepts and the origin it allows, on the ports this stack publishes.
      KEYCLOAK_ISSUER: http://localhost:${KEYCLOAK_PORT:-8081}/realms/learning
      WEB_ORIGIN: http://localhost:${WEB_PORT:-4200}
    volumes:
    - ./infra/kong/bootstrap.py:/bootstrap.py:ro
    - kong-config:/output
    command:
    - python
    - /bootstrap.py
  kong:
    image: kong:3.9.1
    restart: unless-stopped
    # kong starts once the services it routes to are ready, so its first requests are not 502s.
    depends_on:
      gateway-config:
        condition: service_completed_successfully
      identity:
        condition: service_healthy
        required: false
      curriculum:
        condition: service_healthy
        required: false
      content:
        condition: service_healthy
        required: false
      assessment:
        condition: service_healthy
        required: false
      grading:
        condition: service_healthy
        required: false
      analytics:
        condition: service_healthy
        required: false
      question-chatbot-agent:
        condition: service_healthy
        required: false
      question-generation-agent:
        condition: service_healthy
        required: false
    environment:
      KONG_DATABASE: 'off'
      KONG_DECLARATIVE_CONFIG: /config/kong.json
      KONG_ADMIN_LISTEN: 'off'
      KONG_PROXY_ACCESS_LOG: 'off'
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_DNS_VALID_TTL: '5'  # re-resolve services every 5 s, so a recreated container is found without restarting kong
      KONG_DNS_STALE_TTL: '0'  # never route to a cached address after it expires; a restarted container's old ip may now belong to another
# service
    ports:
    - 127.0.0.1:${KONG_PORT:-8000}:8000
    volumes:
    - kong-config:/config:ro
    healthcheck:
      test:
      - CMD
      - kong
      - health
      interval: 10s
      timeout: 5s
      retries: 10
  identity:
    build:
      context: .
      dockerfile: services/identity/Dockerfile
    environment:
      OIDC_ISSUER: http://localhost:${KEYCLOAK_PORT:-8081}/realms/learning
      OIDC_JWKS_URL: http://keycloak:8080/realms/learning/protocol/openid-connect/certs
      OIDC_AUDIENCE: learning
      DATABASE_URL: postgresql://identity:${IDENTITY_DB_PASSWORD:?Run scripts/setup.py or scripts/upgrade_local.py}@postgres:5432/identity?sslmode=disable
      DB_POOL_MAX: ${GO_DB_POOL_MAX:-10}
      DB_POOL_MIN: ${DB_POOL_MIN:-1}
      KAFKA_BROKERS: kafka:9092
      # removes a deleted account's sign-in from keycloak (adr 0011).
      KEYCLOAK_URL: http://keycloak:8080
      ACCOUNTS_CLIENT_SECRET: ${IDENTITY_ACCOUNTS_CLIENT_SECRET:?Run scripts/upgrade_local.py}
    depends_on:
      keycloak:
        condition: service_started
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    init: true
    restart: on-failure:3
    stop_grace_period: 45s
    healthcheck: *go-healthcheck
  curriculum:
    build:
      context: .
      dockerfile: services/curriculum/Dockerfile
    environment:
      OIDC_ISSUER: http://localhost:${KEYCLOAK_PORT:-8081}/realms/learning
      OIDC_JWKS_URL: http://keycloak:8080/realms/learning/protocol/openid-connect/certs
      OIDC_AUDIENCE: learning
      DATABASE_URL: postgresql://curriculum:${CURRICULUM_DB_PASSWORD:?Run scripts/setup.py or scripts/upgrade_local.py}@postgres:5432/curriculum?sslmode=disable
      DB_POOL_MAX: ${GO_DB_POOL_MAX:-10}
      DB_POOL_MIN: ${DB_POOL_MIN:-1}
      IDENTITY_URL: http://identity:8080
    depends_on:
      keycloak:
        condition: service_started
      postgres:
        condition: service_healthy
    init: true
    restart: on-failure:3
    stop_grace_period: 45s
    healthcheck: *go-healthcheck
  content:
    build:
      context: .
      dockerfile: services/content/Dockerfile
    environment:
      OIDC_ISSUER: http://localhost:${KEYCLOAK_PORT:-8081}/realms/learning
      OIDC_JWKS_URL: http://keycloak:8080/realms/learning/protocol/openid-connect/certs
      OIDC_AUDIENCE: learning
      DATABASE_URL: postgresql://content:${CONTENT_DB_PASSWORD:?Run scripts/setup.py or scripts/upgrade_local.py}@postgres:5432/content?sslmode=disable
      DB_POOL_MAX: ${GO_DB_POOL_MAX:-10}
      DB_POOL_MIN: ${DB_POOL_MIN:-1}
      IDENTITY_URL: http://identity:8080
      KAFKA_BROKERS: kafka:9092
      S3_ENDPOINT: seaweedfs:8333
      S3_ACCESS_KEY: ${S3_CONTENT_USER:?Run scripts/setup.py or scripts/upgrade_local.py}
      S3_SECRET_KEY: ${S3_CONTENT_PASSWORD:?Run scripts/setup.py or scripts/upgrade_local.py}
      S3_BUCKET: documents
      S3_SECURE: 'false'
      # the indexing worker and search call ai-core as the content-indexer service account (adr 0002).
      AI_CORE_URL: http://ai-core:8080
      AI_TOKEN_URL: http://keycloak:8080/realms/learning/protocol/openid-connect/token
      AI_CLIENT_ID: content-indexer
      AI_CLIENT_SECRET: ${CONTENT_INDEXER_CLIENT_SECRET:?Run scripts/setup.py or scripts/upgrade_local.py}
    depends_on:
      keycloak:
        condition: service_started
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
    init: true
    restart: on-failure:3
    stop_grace_period: 45s
    healthcheck: *go-healthcheck
  assessment:
    build:
      context: .
      dockerfile: services/assessment/Dockerfile
    environment:
      OIDC_ISSUER: http://localhost:${KEYCLOAK_PORT:-8081}/realms/learning
      OIDC_JWKS_URL: http://keycloak:8080/realms/learning/protocol/openid-connect/certs
      OIDC_AUDIENCE: learning
      DATABASE_URL: postgresql://assessment:${ASSESSMENT_DB_PASSWORD:?Run scripts/setup.py or scripts/upgrade_local.py}@postgres:5432/assessment?sslmode=disable
      DB_POOL_MAX: ${GO_DB_POOL_MAX:-10}
      DB_POOL_MIN: ${DB_POOL_MIN:-1}
      IDENTITY_URL: http://identity:8080
      KAFKA_BROKERS: kafka:9092
      CURRICULUM_URL: http://curriculum:8080
    depends_on:
      keycloak:
        condition: service_started
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    init: true
    restart: on-failure:3
    stop_grace_period: 45s
    healthcheck: *go-healthcheck
  grading:
    build:
      context: .
      dockerfile: services/grading/Dockerfile
    environment:
      OIDC_ISSUER: http://localhost:${KEYCLOAK_PORT:-8081}/realms/learning
      OIDC_JWKS_URL: http://keycloak:8080/realms/learning/protocol/openid-connect/certs
      OIDC_AUDIENCE: learning
      DATABASE_URL: postgresql://grading:${GRADING_DB_PASSWORD:?Run scripts/setup.py or scripts/upgrade_local.py}@postgres:5432/grading?sslmode=disable
      DB_POOL_MAX: ${GO_DB_POOL_MAX:-10}
      DB_POOL_MIN: ${DB_POOL_MIN:-1}
      IDENTITY_URL: http://identity:8080
      KAFKA_BROKERS: kafka:9092
      # ai marking suggestions (adr 0004), billed to the assessment's teacher through ai-core.
      AI_CORE_URL: http://ai-core:8080
      AI_TOKEN_URL: http://keycloak:8080/realms/learning/protocol/openid-connect/token
      AI_CLIENT_ID: grading-marker
      AI_CLIENT_SECRET: ${GRADING_MARKER_CLIENT_SECRET:?Run scripts/setup.py or scripts/upgrade_local.py}
    depends_on:
      keycloak:
        condition: service_started
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    init: true
    restart: on-failure:3
    stop_grace_period: 45s
    healthcheck: *go-healthcheck
  analytics:
    build:
      context: .
      dockerfile: services/analytics/Dockerfile
    environment:
      OIDC_ISSUER: http://localhost:${KEYCLOAK_PORT:-8081}/realms/learning
      OIDC_JWKS_URL: http://keycloak:8080/realms/learning/protocol/openid-connect/certs
      OIDC_AUDIENCE: learning
      DATABASE_URL: postgresql://analytics:${ANALYTICS_DB_PASSWORD:?Run scripts/setup.py or scripts/upgrade_local.py}@postgres:5432/analytics?sslmode=disable
      DB_POOL_MAX: ${PYTHON_DB_POOL_MAX:-8}
      DB_POOL_MIN: ${DB_POOL_MIN:-1}
      IDENTITY_URL: http://identity:8080
      KAFKA_BROKERS: kafka:9092
      # a new group re-reads every retained event, for rebuilding into a new database (operations.md).
      KAFKA_GROUP: ${ANALYTICS_KAFKA_GROUP:-analytics-v1}
    depends_on:
      keycloak:
        condition: service_started
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    init: true
    restart: on-failure:3
    stop_grace_period: 45s
    healthcheck: *python-healthcheck
  ai-core:
    build:
      context: .
      dockerfile: services/ai-core/Dockerfile
    environment:
      OIDC_ISSUER: http://localhost:${KEYCLOAK_PORT:-8081}/realms/learning
      OIDC_JWKS_URL: http://keycloak:8080/realms/learning/protocol/openid-connect/certs
      OIDC_AUDIENCE: learning
      # provider keys exist only in ai-core (adr 0002).
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      EMBEDDING_MODEL: text-embedding-3-small
      CHAT_MODEL: gpt-6-luna
      TABLE_VISION_MODEL: gpt-5.4-mini
      FIGURE_MODEL: gpt-6-luna
      RERANKER_MODEL: rerank-3
      AI_CORE_CACHE_DIR: /var/cache/ai-core
      SELECTIVE_VISION: ${SELECTIVE_VISION:-true}
      AI_TOTAL_SPEND_LIMIT_USD: ${AI_TOTAL_SPEND_LIMIT_USD:-}
      CHUNK_TOKENS: ${CHUNK_TOKENS:-600}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-90}
      SLIDE_CHUNKS: ${SLIDE_CHUNKS:-true}
      # per-user daily ai spend (adr 0003).
      DATABASE_URL: postgresql://aicore:${AICORE_DB_PASSWORD:?Run scripts/setup.py or scripts/upgrade_local.py}@postgres:5432/aicore?sslmode=disable
      DB_POOL_MAX: ${PYTHON_DB_POOL_MAX:-8}
      DB_POOL_MIN: ${DB_POOL_MIN:-1}
      SPEND_LIMIT_STUDENT_USD: '5'
      SPEND_LIMIT_TEACHER_USD: '10'
      SPEND_TIMEZONE: Asia/Singapore
    volumes:
      - ai-core-cache:/var/cache/ai-core
    depends_on:
      keycloak:
        condition: service_started
      postgres:
        condition: service_healthy
    init: true
    restart: on-failure:3
    stop_grace_period: 45s
    healthcheck: *python-healthcheck
  question-generation-agent:
    build:
      context: .
      dockerfile: services/question-generation-agent/Dockerfile
    environment:
      OIDC_ISSUER: http://localhost:${KEYCLOAK_PORT:-8081}/realms/learning
      OIDC_JWKS_URL: http://keycloak:8080/realms/learning/protocol/openid-connect/certs
      OIDC_AUDIENCE: learning
      # stateless (adr 0006).
      IDENTITY_URL: http://identity:8080
      CURRICULUM_URL: http://curriculum:8080
      CONTENT_URL: http://content:8080
      AI_CORE_URL: http://ai-core:8080
      AI_TOKEN_URL: http://keycloak:8080/realms/learning/protocol/openid-connect/token
      AI_CLIENT_ID: question-generation-agent
      AI_CLIENT_SECRET: ${QUESTION_GENERATION_AGENT_CLIENT_SECRET:?Run scripts/setup.py or scripts/upgrade_local.py}
    depends_on:
      keycloak:
        condition: service_started
    init: true
    restart: on-failure:3
    stop_grace_period: 45s
    healthcheck: *python-healthcheck
  student-performance-agent:
    build:
      context: .
      dockerfile: services/student-performance-agent/Dockerfile
    environment:
      OIDC_ISSUER: http://localhost:${KEYCLOAK_PORT:-8081}/realms/learning
      OIDC_JWKS_URL: http://keycloak:8080/realms/learning/protocol/openid-connect/certs
      OIDC_AUDIENCE: learning
    depends_on:
      keycloak:
        condition: service_started
    init: true
    restart: on-failure:3
    stop_grace_period: 45s
    healthcheck: *python-healthcheck
  question-chatbot-agent:
    build:
      context: .
      dockerfile: services/question-chatbot-agent/Dockerfile
    environment:
      OIDC_ISSUER: http://localhost:${KEYCLOAK_PORT:-8081}/realms/learning
      OIDC_JWKS_URL: http://keycloak:8080/realms/learning/protocol/openid-connect/certs
      OIDC_AUDIENCE: learning
      # threads and messages only (adr 0002).
      DATABASE_URL: postgresql://chatbot:${CHATBOT_DB_PASSWORD:?Run scripts/setup.py or scripts/upgrade_local.py}@postgres:5432/chatbot?sslmode=disable
      DB_POOL_MAX: ${PYTHON_DB_POOL_MAX:-8}
      DB_POOL_MIN: ${DB_POOL_MIN:-1}
      ADAPTIVE_REWRITE: ${ADAPTIVE_REWRITE:-true}
      ADAPTIVE_SEARCH: ${ADAPTIVE_SEARCH:-true}
      CHAT_CONTEXT_TOKENS: ${CHAT_CONTEXT_TOKENS:-8000}
      IDENTITY_URL: http://identity:8080
      # searches run with the user's own token; ai-core gets this agent's service account.
      CONTENT_URL: http://content:8080
      AI_CORE_URL: http://ai-core:8080
      AI_TOKEN_URL: http://keycloak:8080/realms/learning/protocol/openid-connect/token
      AI_CLIENT_ID: question-chatbot-agent
      AI_CLIENT_SECRET: ${QUESTION_CHATBOT_AGENT_CLIENT_SECRET:?Run scripts/setup.py or scripts/upgrade_local.py}
      # purges a deleted classroom's threads (identity.classroom.deleted.v1).
      KAFKA_BROKERS: kafka:9092
    depends_on:
      keycloak:
        condition: service_started
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    init: true
    restart: on-failure:3
    stop_grace_period: 45s
    healthcheck: *python-healthcheck
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      # served to the app as /config.json and allowed by its content-security-policy (apps/web/nginx.conf).
      GATEWAY_URL: http://localhost:${KONG_PORT:-8000}
      KEYCLOAK_URL: http://localhost:${KEYCLOAK_PORT:-8081}
    ports:
    - 127.0.0.1:${WEB_PORT:-4200}:8080
    depends_on:
      kong:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres-data: {}
  keycloak-data: {}
  kafka-data: {}
  seaweedfs-data: {}
  ai-core-cache: {}
  kong-config: {}

