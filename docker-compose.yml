name: learning-foundation
services:
  postgres:
    # Postgres 17 with pgvector, for Content's chunk embeddings (docs/decisions/0002-ai-integration.md)
    image: pgvector/pgvector:0.8.1-pg17
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup.py}
    volumes:
    - postgres-data:/var/lib/postgresql/data
    - ./.local/postgres-init.sql:/docker-entrypoint-initdb.d/01-services.sql:ro
    healthcheck:
      test:
      - CMD-SHELL
      # Over TCP: the temporary server that runs the init scripts only listens on the socket
      - pg_isready -h 127.0.0.1 -U postgres
      interval: 5s
      timeout: 3s
      retries: 20
  keycloak:
    image: quay.io/keycloak/keycloak:26.3.3
    command:
    - start-dev
    - --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: 'true'
      KC_HEALTH_ENABLED: 'true'
    ports:
    - 127.0.0.1:8081:8080
    volumes:
    - ./.local/learning-realm.json:/opt/keycloak/data/import/learning-realm.json:ro
    - keycloak-data:/opt/keycloak/data
  kafka:
    image: apache/kafka:4.1.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_RETENTION_HOURS: 720
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
    - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
      - CMD-SHELL
      - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list
      interval: 10s
      timeout: 10s
      retries: 20
  kafka-init:
    image: apache/kafka:4.1.2
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint:
    - /bin/sh
    - -ec
    command:
    - for topic in content.uploaded.v1 content.indexed.v1 assessment.submitted.v1 grading.finalized.v1
      assessment.submitted.v2 grading.finalized.v2 identity.classroom.deleted.v1
      assessment.submitted.v1.dlq grading.finalized.v1.dlq assessment.submitted.v2.dlq
      grading.finalized.v2.dlq identity.classroom.deleted.v1.dlq; do /opt/kafka/bin/kafka-topics.sh
      --bootstrap-server kafka:9092 --create --if-not-exists --topic $$topic --partitions
      3 --replication-factor 1; done
  # S3-compatible document storage. MinIO's images stopped being publicly downloadable, so this is
  # SeaweedFS. The S3 identities are written from .env at start: an admin, and a content-service
  # user that can only read, write and list the documents bucket. The S3 API is not published.
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    environment:
      ROOT_USER: ${S3_ROOT_USER}
      ROOT_PASSWORD: ${S3_ROOT_PASSWORD}
      CONTENT_USER: ${S3_CONTENT_USER}
      CONTENT_PASSWORD: ${S3_CONTENT_PASSWORD}
    entrypoint:
    - /bin/sh
    - -ec
    command:
    - umask 077; printf '{"identities":[{"name":"admin","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","List","Tagging","Write"]},{"name":"content-service","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Read:documents","Write:documents","List:documents"]}]}'
      "$$ROOT_USER" "$$ROOT_PASSWORD" "$$CONTENT_USER" "$$CONTENT_PASSWORD" > /tmp/s3.json;
      exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    volumes:
    - seaweedfs-data:/data
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q -O /dev/null http://127.0.0.1:9333/cluster/status
      interval: 3s
      timeout: 3s
      retries: 40
  storage-init:
    image: chrislusf/seaweedfs:4.48
    depends_on:
      seaweedfs:
        condition: service_healthy
    entrypoint:
    - /bin/sh
    - -ec
    command:
    - for i in $$(seq 1 60); do echo s3.bucket.list | weed shell -master=seaweedfs:9333 > /tmp/buckets && break; sleep 2; done;
      grep -q '^ *documents' /tmp/buckets || echo 's3.bucket.create -name documents' | weed shell -master=seaweedfs:9333;
      echo s3.bucket.list | weed shell -master=seaweedfs:9333 | grep -q '^ *documents'
  gateway-config:
    image: python:3.13.7-alpine
    depends_on:
    - keycloak
    volumes:
    - ./infra/kong/bootstrap.py:/bootstrap.py:ro
    - kong-config:/output
    command:
    - python
    - /bootstrap.py
  kong:
    image: kong:3.9.1
    depends_on:
      gateway-config:
        condition: service_completed_successfully
    environment:
      KONG_DATABASE: 'off'
      KONG_DECLARATIVE_CONFIG: /config/kong.json
      KONG_ADMIN_LISTEN: 'off'
      KONG_PROXY_ACCESS_LOG: 'off'
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_DNS_VALID_TTL: '5'  # re-resolve services every 5 s, so a recreated container is found without restarting Kong
      KONG_DNS_STALE_TTL: '0'  # never route to a cached address after it expires; a restarted container's old IP may now belong to another service
    ports:
    - 127.0.0.1:8000:8000
    volumes:
    - kong-config:/config:ro
    healthcheck:
      test:
      - CMD
      - kong
      - health
      interval: 10s
      timeout: 5s
      retries: 10
  identity:
    build:
      context: .
      dockerfile: services/identity/Dockerfile
    environment:
      OIDC_ISSUER: http://localhost:8081/realms/learning
      OIDC_JWKS_URL: http://keycloak:8080/realms/learning/protocol/openid-connect/certs
      OIDC_AUDIENCE: learning
      DATABASE_URL: postgresql://identity:${IDENTITY_DB_PASSWORD}@postgres:5432/identity?sslmode=disable
      IDENTITY_URL: http://identity:8080
      KAFKA_BROKERS: kafka:9092
    depends_on:
      keycloak:
        condition: service_started
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    init: true
    restart: on-failure:3
    stop_grace_period: 45s
  curriculum:
    build:
      context: .
      dockerfile: services/curriculum/Dockerfile
    environment:
      OIDC_ISSUER: http://localhost:8081/realms/learning
      OIDC_JWKS_URL: http://keycloak:8080/realms/learning/protocol/openid-connect/certs
      OIDC_AUDIENCE: learning
      DATABASE_URL: postgresql://curriculum:${CURRICULUM_DB_PASSWORD}@postgres:5432/curriculum?sslmode=disable
      IDENTITY_URL: http://identity:8080
    depends_on:
      keycloak:
        condition: service_started
      postgres:
        condition: service_healthy
    init: true
    restart: on-failure:3
    stop_grace_period: 45s
  content:
    build:
      context: .
      dockerfile: services/content/Dockerfile
    environment:
      OIDC_ISSUER: http://localhost:8081/realms/learning
      OIDC_JWKS_URL: http://keycloak:8080/realms/learning/protocol/openid-connect/certs
      OIDC_AUDIENCE: learning
      DATABASE_URL: postgresql://content:${CONTENT_DB_PASSWORD}@postgres:5432/content?sslmode=disable
      IDENTITY_URL: http://identity:8080
      KAFKA_BROKERS: kafka:9092
      S3_ENDPOINT: seaweedfs:8333
      S3_ACCESS_KEY: ${S3_CONTENT_USER}
      S3_SECRET_KEY: ${S3_CONTENT_PASSWORD}
      S3_BUCKET: documents
      S3_SECURE: 'false'
      # The indexing worker and search call ai-core as the content-indexer service account (ADR 0002).
      AI_CORE_URL: http://ai-core:8080
      AI_TOKEN_URL: http://keycloak:8080/realms/learning/protocol/openid-connect/token
      AI_CLIENT_ID: content-indexer
      AI_CLIENT_SECRET: ${CONTENT_INDEXER_CLIENT_SECRET:?Run scripts/setup.py}
    depends_on:
      keycloak:
        condition: service_started
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
    init: true
    restart: on-failure:3
    stop_grace_period: 45s
  assessment:
    build:
      context: .
      dockerfile: services/assessment/Dockerfile
    environment:
      OIDC_ISSUER: http://localhost:8081/realms/learning
      OIDC_JWKS_URL: http://keycloak:8080/realms/learning/protocol/openid-connect/certs
      OIDC_AUDIENCE: learning
      DATABASE_URL: postgresql://assessment:${ASSESSMENT_DB_PASSWORD}@postgres:5432/assessment?sslmode=disable
      IDENTITY_URL: http://identity:8080
      KAFKA_BROKERS: kafka:9092
      CURRICULUM_URL: http://curriculum:8080
    depends_on:
      keycloak:
        condition: service_started
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    init: true
    restart: on-failure:3
    stop_grace_period: 45s
  grading:
    build:
      context: .
      dockerfile: services/grading/Dockerfile
    environment:
      OIDC_ISSUER: http://localhost:8081/realms/learning
      OIDC_JWKS_URL: http://keycloak:8080/realms/learning/protocol/openid-connect/certs
      OIDC_AUDIENCE: learning
      DATABASE_URL: postgresql://grading:${GRADING_DB_PASSWORD}@postgres:5432/grading?sslmode=disable
      IDENTITY_URL: http://identity:8080
      KAFKA_BROKERS: kafka:9092
      # AI marking suggestions (ADR 0004), billed to the assessment's teacher through ai-core.
      AI_CORE_URL: http://ai-core:8080
      AI_TOKEN_URL: http://keycloak:8080/realms/learning/protocol/openid-connect/token
      AI_CLIENT_ID: grading-marker
      AI_CLIENT_SECRET: ${GRADING_MARKER_CLIENT_SECRET:?Run scripts/setup.py or scripts/upgrade_local.py}
    depends_on:
      keycloak:
        condition: service_started
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    init: true
    restart: on-failure:3
    stop_grace_period: 45s
  analytics:
    build:
      context: .
      dockerfile: services/analytics/Dockerfile
    environment:
      OIDC_ISSUER: http://localhost:8081/realms/learning
      OIDC_JWKS_URL: http://keycloak:8080/realms/learning/protocol/openid-connect/certs
      OIDC_AUDIENCE: learning
      DATABASE_URL: postgresql://analytics:${ANALYTICS_DB_PASSWORD}@postgres:5432/analytics?sslmode=disable
      IDENTITY_URL: http://identity:8080
      KAFKA_BROKERS: kafka:9092
    depends_on:
      keycloak:
        condition: service_started
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    init: true
    restart: on-failure:3
    stop_grace_period: 45s
  ai-core:
    build:
      context: .
      dockerfile: services/ai-core/Dockerfile
    environment:
      OIDC_ISSUER: http://localhost:8081/realms/learning
      OIDC_JWKS_URL: http://keycloak:8080/realms/learning/protocol/openid-connect/certs
      OIDC_AUDIENCE: learning
      # Provider keys exist only in ai-core (ADR 0002). Unset: ai-core answers 503 AI_PROVIDER_NOT_CONFIGURED.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      EMBEDDING_MODEL: text-embedding-3-small
      CHAT_MODEL: gpt-6-luna
      TABLE_VISION_MODEL: gpt-5.4-mini
      FIGURE_MODEL: gpt-6-luna
      RERANKER_MODEL: rerank-3
      AI_CORE_CACHE_DIR: /var/cache/ai-core
      # Per-user daily AI spend (ADR 0003). Run scripts/upgrade_local.py if .env predates this database.
      DATABASE_URL: postgresql://aicore:${AICORE_DB_PASSWORD:?Run scripts/upgrade_local.py}@postgres:5432/aicore?sslmode=disable
      SPEND_LIMIT_STUDENT_USD: '5'
      SPEND_LIMIT_TEACHER_USD: '10'
      SPEND_TIMEZONE: Asia/Singapore
    volumes:
      - ai-core-cache:/var/cache/ai-core
    depends_on:
      keycloak:
        condition: service_started
      postgres:
        condition: service_healthy
    init: true
    restart: on-failure:3
    stop_grace_period: 45s
  question-generation-agent:
    build:
      context: .
      dockerfile: services/question-generation-agent/Dockerfile
    environment:
      OIDC_ISSUER: http://localhost:8081/realms/learning
      OIDC_JWKS_URL: http://keycloak:8080/realms/learning/protocol/openid-connect/certs
      OIDC_AUDIENCE: learning
    depends_on:
      keycloak:
        condition: service_started
    init: true
    restart: on-failure:3
    stop_grace_period: 45s
  student-performance-agent:
    build:
      context: .
      dockerfile: services/student-performance-agent/Dockerfile
    environment:
      OIDC_ISSUER: http://localhost:8081/realms/learning
      OIDC_JWKS_URL: http://keycloak:8080/realms/learning/protocol/openid-connect/certs
      OIDC_AUDIENCE: learning
    depends_on:
      keycloak:
        condition: service_started
    init: true
    restart: on-failure:3
    stop_grace_period: 45s
  question-chatbot-agent:
    build:
      context: .
      dockerfile: services/question-chatbot-agent/Dockerfile
    environment:
      OIDC_ISSUER: http://localhost:8081/realms/learning
      OIDC_JWKS_URL: http://keycloak:8080/realms/learning/protocol/openid-connect/certs
      OIDC_AUDIENCE: learning
      # Threads and messages only (ADR 0002). Run scripts/upgrade_local.py if .env predates this database.
      DATABASE_URL: postgresql://chatbot:${CHATBOT_DB_PASSWORD:?Run scripts/upgrade_local.py}@postgres:5432/chatbot?sslmode=disable
      IDENTITY_URL: http://identity:8080
      # Searches run with the user's own token; ai-core gets this agent's service account.
      CONTENT_URL: http://content:8080
      AI_CORE_URL: http://ai-core:8080
      AI_TOKEN_URL: http://keycloak:8080/realms/learning/protocol/openid-connect/token
      AI_CLIENT_ID: question-chatbot-agent
      AI_CLIENT_SECRET: ${QUESTION_CHATBOT_AGENT_CLIENT_SECRET:?Run scripts/setup.py}
      # Purges a deleted classroom's threads (identity.classroom.deleted.v1).
      KAFKA_BROKERS: kafka:9092
    depends_on:
      keycloak:
        condition: service_started
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    init: true
    restart: on-failure:3
    stop_grace_period: 45s
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
    - 127.0.0.1:4200:80
    depends_on:
    - kong
volumes:
  postgres-data: {}
  keycloak-data: {}
  kafka-data: {}
  seaweedfs-data: {}
  ai-core-cache: {}
  kong-config: {}

