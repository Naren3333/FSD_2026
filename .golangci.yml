# shared golangci-lint settings for the go modules (packages/platform and the five go services).
version: "2"
linters:
  enable:
    - bodyclose      # http response bodies are closed
    - errorlint      # errors are compared with errors.is / errors.as, so wrapped errors still match
    - gocritic       # common style and correctness checks
    - gocyclo        # function complexity
    - misspell
    - nilerr         # a nil return after an error check
    - noctx          # outgoing http requests carry a context
    - prealloc
    - revive         # go style: naming, exported docs, error strings
    - unparam        # parameters and results that never vary
    - usestdlibvars  # net/http status and method constants instead of literals
  settings:
    errcheck:
      # deferred cleanup whose error has nowhere to go: a rollback after commit, closing a body already
      # read.
      exclude-functions:
        - (github.com/jackc/pgx/v5.Tx).Rollback
        - (github.com/jackc/pgx/v5.BatchResults).Close
        - (io.Closer).Close
        - (io.ReadCloser).Close
        - (*github.com/minio/minio-go/v7.Object).Close
        - (*github.com/segmentio/kafka-go.Conn).Close
        - (*github.com/segmentio/kafka-go.Reader).Close
        - (*github.com/segmentio/kafka-go.Writer).Close
    gocyclo:
      min-complexity: 15
  exclusions:
    rules:
      # lowercase comments intentionally differ from exported identifier casing.
      - linters: [revive]
        text: 'comment on exported .* should be of the form|package comment should be of the form'
      # test fixtures write canned responses and set up state; a failure there fails the assertion that
      # follows.
      - path: _test\.go
        linters: [errcheck, gocyclo, noctx, prealloc, unparam]
      - path: _test\.go
        linters: [revive]
        text: unused-parameter
formatters:
  enable:
    - gofmt
