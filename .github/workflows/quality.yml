name: Foundation quality
on: [push, pull_request]
jobs:
  go:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        path: [packages/platform, services/identity, services/curriculum, services/content, services/assessment, services/grading]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.7'
          cache-dependency-path: ${{ matrix.path }}/go.sum
      - working-directory: ${{ matrix.path }}
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
          go build ./...
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [analytics, ai-core, question-generation-agent, student-performance-agent, question-chatbot-agent]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.lock
      - working-directory: services/${{ matrix.service }}
        env:
          PYTHONPATH: ${{ github.workspace }}/packages/python-platform
          MYPYPATH: ${{ github.workspace }}/packages/python-platform
        run: |
          python -m ruff format --check .
          python -m ruff check .
          python -m mypy main.py
          python -m pytest -q
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.17.0'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: python -m pip install -r requirements-dev.lock
      - run: python scripts/setup.py
      - run: docker compose up -d --build
      - run: python scripts/wait_ready.py
      - run: python scripts/integration.py
      - working-directory: apps/web
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build
          npx playwright install --with-deps chromium
          npm run test:e2e
      - if: always()
        run: docker compose down
