name: Foundation quality
on: [push, pull_request]
jobs:
  go:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        path: [packages/platform, services/identity, services/curriculum, services/content, services/assessment, services/grading]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.7'
          cache-dependency-path: ${{ matrix.path }}/go.sum
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
          working-directory: ${{ matrix.path }}
          args: --config ${{ github.workspace }}/.golangci.yml
      - working-directory: ${{ matrix.path }}
        shell: bash
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -v ./... | tee "$RUNNER_TEMP/go-test.log"
          go build -o /dev/null ./...
          # database suites run separately in the integration job.
          if grep -B1 -- '--- SKIP' "$RUNNER_TEMP/go-test.log"; then
            echo "::warning title=Skipped tests::${{ matrix.path }} skipped tests (listed above)"
          fi
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [analytics, ai-core, question-generation-agent, student-performance-agent, question-chatbot-agent]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.lock
      - working-directory: services/${{ matrix.service }}
        env:
          PYTHONPATH: ${{ github.workspace }}/packages/python-platform
          MYPYPATH: ${{ github.workspace }}/packages/python-platform
        run: |
          python -m ruff format --check .
          python -m ruff check .
          python -m mypy main.py
          python -m pytest -q -rs
  python-platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.lock
      - working-directory: packages/python-platform
        run: |
          python -m ruff format --check .
          python -m ruff check .
          python -m pytest -q -rs
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.lock
      - run: |
          python -m ruff format --check --config ruff.toml scripts infra
          python -m ruff check --config ruff.toml scripts infra
          python -m pytest -q -rs -p no:cacheprovider scripts/tests
      # the committed contracts must match what the python apps and export_contracts.py's go contracts
      # produce.
      - run: python scripts/export_contracts.py --check
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.17.0'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - working-directory: apps/web
        run: |
          npm ci
          npm run format:check
          npm run lint
          npm run typecheck
          npm test
          npm run build
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.17.0'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: python -m pip install -r requirements-dev.lock
      - run: python scripts/setup.py
      - working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      # integration, then the database-backed tests that skip themselves in the jobs above, then the browser
      # tests, in a fresh learning-test stack that the script removes afterwards.
      - run: python scripts/stack_tests.py integration db e2e
